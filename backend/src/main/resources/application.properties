spring.application.name=workforce360-backend

# Active profile: 'postgres' for PostgreSQL, 'h2' for local in-memory, 'mysql' for MySQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# Server port (Render automatically provides $PORT)
server.port=${PORT:8080}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Allowed CORS origins (comma-separated: local dev + Vercel frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

